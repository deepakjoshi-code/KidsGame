name: Deploy to GitHub Pages

# Publishes the app/ folder as a static site. Notes:
# - GitHub Pages on a private repository needs a paid plan (Pro, Team or Enterprise).
# - GitHub Pages ignores app/_headers, so the CSP <meta> tag in index.html is what applies there.
#   Netlify and Cloudflare Pages do honour _headers (stricter: adds frame-ancestors and more).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: app
        run: node --test tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the runtime files only
        run: |
          mkdir -p _site
          rsync -a --exclude 'tests/' --exclude 'tools/' --exclude 'docs/' --exclude '*.md' \
            --exclude 'package.json' --exclude '*.py' --exclude '_headers' app/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

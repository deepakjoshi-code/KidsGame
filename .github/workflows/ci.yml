name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit, security-lint and precache tests
        working-directory: app
        run: node --test tests/*.test.mjs
      - name: Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Worker and AI tests (with the worker's SDK installed)
        working-directory: app
        run: node --test tests/worker.test.mjs tests/ai.test.mjs

<style>
/* Layout: one screen — header strip, picture-book stage, chunky button tray */
:root {
  --paper: #fbf4e2;
  --paper-2: #f3e7c8;
  --ink: #3b2a1e;
  --leaf: #5f9e45;
  --sky: #3d7fd6;
  --sun: #f0a040;
  --berry: #d8453b;
  --display: "Chalkboard SE", "Marker Felt", "Comic Sans MS", "Chalkboard", cursive;
  --body: "Chalkboard SE", "Comic Sans MS", "Avenir Next", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
}
#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; gap: 10px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px)); }
img { -webkit-user-drag: none; pointer-events: none; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-size: 1.6rem; font-weight: 700; color: var(--sun); -webkit-text-stroke: 1px var(--ink); letter-spacing: .02em; }
#chapter { flex: 1; min-width: 0; font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip {
  font: inherit; font-size: .95rem; font-weight: 700; color: var(--ink);
  background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: 999px;
  padding: 6px 14px; cursor: pointer;
}
.chip[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
#stage {
  position: relative; flex: 1; min-height: 0;
  border: 4px solid var(--ink); border-radius: 18px; overflow: hidden;
  background: #2c231d;
}
canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
.overlay {
  position: absolute; inset: 0; background: var(--paper);
  display: flex; align-items: center; justify-content: center; gap: 24px; padding: 20px;
}
/* Title & ending */
#title, #end { flex-direction: column; text-align: center; gap: 14px; }
#title img, #end img { max-height: 46%; border: 4px solid var(--ink); border-radius: 12px; }
.big-title { font-family: var(--display); font-size: clamp(2.4rem, 7vw, 4.6rem); font-weight: 700; color: var(--sun); -webkit-text-stroke: 2px var(--ink); margin: 0; line-height: 1; }
.credit { font-size: 1.05rem; margin: 0; }
.credit strong { color: var(--berry); }
#help {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  padding: 8px 20px; font-size: clamp(.95rem, 2vw, 1.3rem); font-weight: 700;
  max-width: calc(100% - 24px); text-align: center;
}
/* Button tray */
#controls { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; min-height: 96px; align-items: center; }
.act {
  font: inherit; font-family: var(--display); font-weight: 700; font-size: clamp(1.3rem, 3vw, 2rem);
  color: #fff; -webkit-text-stroke: .5px var(--ink); text-shadow: 0 2px 0 rgba(0,0,0,.25);
  min-width: 170px; padding: 16px 28px; border-radius: 22px; cursor: pointer;
  border: 4px solid var(--ink); background: var(--sky);
  box-shadow: 0 7px 0 var(--ink); transition: transform .06s, box-shadow .06s;
  touch-action: manipulation; position: relative; overflow: hidden;
}
.act .icon { font-size: 1.25em; margin-right: 8px; -webkit-text-stroke: 0; }
.act kbd { display: block; font-family: var(--body); font-size: .45em; font-weight: 700; opacity: .9; -webkit-text-stroke: 0; }
.act:active, .act.pressed { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink); }
.act:focus-visible, .chip:focus-visible { outline: 4px dashed var(--sun); outline-offset: 4px; }
.act.green { background: var(--leaf); }
.act.orange { background: var(--sun); }
.act.red { background: var(--berry); }
.act.gray { background: #8a7a6a; }
.act[disabled] { cursor: default; filter: grayscale(.7); }
.act .fill { position: absolute; left: 0; bottom: 0; height: 6px; background: #fff6; width: 0; }
.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .bubble { transition: none; } }
@media (max-width: 640px) {
  .act { min-width: 130px; padding: 12px 18px; }
  .chip .lbl, #chapter { display: none; }
  header { justify-content: space-between; }
}
@media (hover: none) { .act kbd { display: none; } }
/* Speech caption: only shown when the phone is upright (see below) */
#caption { display: none; }
#caption b { display: block; font-size: .62em; letter-spacing: .08em; text-transform: uppercase; color: var(--sky); }
#caption.quiet { color: #8a7a6a; font-size: 1.05rem; text-align: center; }
/* Phone held upright: wide picture on top, big speech caption, big buttons */
@media (orientation: portrait) and (max-width: 600px) {
  #app { gap: 10px; }
  .logo { font-size: 1.35rem; }
  .chip { padding: 5px 12px; }
  #stage { flex: none; aspect-ratio: 4 / 3; max-height: 48vh; border-width: 3px; border-radius: 14px; }
  #stage canvas { object-fit: cover; }
  #stage:has(> .overlay:not([hidden])) { flex: 1; aspect-ratio: auto; }
  #help { display: none !important; }
  #caption {
    display: flex; flex-direction: column; justify-content: center; position: relative;
    flex: 1; min-height: 0; overflow-y: auto;
    background: #fff; border: 3px solid var(--ink); border-radius: 20px;
    padding: 12px 18px; font-size: clamp(1.3rem, 6vw, 1.8rem); line-height: 1.3; font-weight: 700;
  }
  #app:has(.overlay:not([hidden])) #caption { display: none; }
  #controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; padding-bottom: 6px; }
  #controls > .act:only-child, #controls > .act:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .act { min-width: 0; padding: 16px 8px; font-size: clamp(1.4rem, 6.5vw, 1.9rem); border-radius: 20px; }
}
/* Phone held sideways: picture on the left, big buttons on the right */
@media (orientation: landscape) and (max-height: 520px) {
  #app { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding-block: max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-bottom, 0px)); }
  header { grid-column: 1 / -1; gap: 8px; }
  .logo { font-size: 1.2rem; }
  #chapter { font-size: .9rem; }
  .chip { font-size: .8rem; padding: 3px 10px; border-width: 2px; }
  #stage { border-width: 3px; border-radius: 12px; }
  #controls { display: grid; grid-auto-rows: min-content; align-content: center; gap: 12px; min-height: 0; overflow-y: auto; padding-bottom: 6px; }
  #controls:has(> :nth-child(4)) { grid-template-columns: 1fr 1fr; gap: 10px; }
  .act { min-width: 0; width: clamp(104px, 17vw, 168px); padding: 10px 8px; font-size: clamp(1rem, 2.6vw, 1.3rem); border-width: 3px; border-radius: 16px; box-shadow: 0 5px 0 var(--ink); }
  .act .icon { display: block; margin: 0 0 2px; }
  .act:active, .act.pressed { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  #story { flex-wrap: nowrap; gap: 12px; padding: 10px; }
  #story img { max-width: 58%; border-width: 3px; }
  .bubbles { min-width: 0; max-height: 100%; overflow-y: auto; gap: 8px; }
  .bubble { font-size: 1rem; padding: 6px 12px; border-radius: 14px; }
  #title, #end { gap: 6px; padding: 8px; }
  #title img, #end img { max-height: 45%; }
  .big-title { font-size: 2.2rem; }
  .credit { font-size: .85rem; }
  #help { font-size: .78rem; padding: 3px 12px; top: 4px; border-width: 2px; max-width: 80%; }
}
</style>
</head>

/* ---------------- sound (made with WebAudio, no files) ---------------- */
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === "suspended") ac.resume();
  return ac;
}
function tone(f, dur, type = "sine", vol = 0.15, f2 = null, delay = 0) {
  if (!settings.sound) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1000, delay = 0) {
  if (!settings.sound) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
// iPhone only allows sound after a tap: play a silent blip on the first touch
function unlockAudio() {
  const a = audio();
  if (a) { const b = a.createBuffer(1, 1, 22050), src = a.createBufferSource(); src.buffer = b; src.connect(a.destination); src.start(0); }
  ["touchend", "click", "keydown"].forEach((ev) => document.removeEventListener(ev, unlockAudio, true));
}
["touchend", "click", "keydown"].forEach((ev) => document.addEventListener(ev, unlockAudio, true));

/* ---------------- read aloud ---------------- */
const VOICE = {
  Mousie: { pitch: 1.6, rate: 0.95 }, Birdie: { pitch: 1.9, rate: 1 }, Daddy: { pitch: 0.7, rate: 0.85 },
  Snake: { pitch: 1.1, rate: 0.9 }, "T-Rex": { pitch: 0.2, rate: 0.7 }, Lion: { pitch: 0.4, rate: 0.8 },
  "Fire truck": { pitch: 1.3, rate: 1 }, Everyone: { pitch: 1.3, rate: 0.9 }, Narrator: { pitch: 1, rate: 0.9 },
};
let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find((v) => /Samantha/.test(v.name)) || vs.find((v) => v.lang === "en-US") || vs.find((v) => /^en/.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function stopSpeech() { if ("speechSynthesis" in window) speechSynthesis.cancel(); }
let speakToken = 0;
function speakLines(lines, onLine) {
  stopSpeech();
  const token = ++speakToken;
  lines.forEach(([who, text, fx], i) => {
    const start = () => { if (token !== speakToken) return; onLine && onLine(i); if (fx && sfx[fx]) sfx[fx](); };
    if (!settings.read || !("speechSynthesis" in window)) { setTimeout(start, i * 1400); return; }
    const u = new SpeechSynthesisUtterance(text.replace(/!!+/g, "!").replace(/\?\?+/g, "?"));
    const v = VOICE[who] || VOICE.Narrator;
    u.pitch = v.pitch; u.rate = v.rate; if (voice) u.voice = voice;
    u.onstart = start;
    speechSynthesis.speak(u);
  });
}
function say(text) { speakLines([["Narrator", text]]); }

/* ---------------- controls tray ---------------- */
let keyMap = {};
function setControls(list) {
  const nav = $("controls");
  nav.innerHTML = ""; keyMap = {};
  list.forEach((b) => {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "act " + (b.color || "") + (b.pulse ? " pulse" : "");
    el.innerHTML = `<span class="icon">${b.icon || ""}</span>${b.label}${b.keyName ? `<kbd>${b.keyName}</kbd>` : ""}<span class="fill"></span>`;
    if (b.tap) el.addEventListener("click", () => { if (!el.disabled) { audio(); b.fn(); } });
    else el.addEventListener("pointerdown", (e) => { e.preventDefault(); if (!el.disabled) { audio(); b.fn(); } });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); } });
    b.el = el;
    (b.keys || []).forEach((k) => (keyMap[k] = b));
    nav.appendChild(el);
  });
  return list;
}
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  const b = keyMap[e.key] || keyMap[e.key.toLowerCase()];
  if (b && !b.el.disabled) {
    e.preventDefault(); audio(); b.fn();
    b.el.classList.add("pressed"); setTimeout(() => b.el.classList.remove("pressed"), 120);
  }
});
const NEXT_KEYS = [" ", "Enter", "ArrowRight"];

/* ---------------- game state & flow ---------------- */
const game = { step: -1, cheese: 0, stars: 0 };
let scene = null; // active level

function showOnly(id) {

  $("help").hidden = true;
}

  showOnly("title"); $("chapter").textContent = "The Adventure Game";
  setControls([{ icon: "▶", label: "Play!", color: "green", pulse: true, tap: true, keys: NEXT_KEYS, keyName: "space", fn: () => goStep(0) }]);
}

/* ---------------- cartoon scenes: the story plays like a video ---------------- */
// A scene is { bg(c), setup(c), beats: [...], update?(c, dt), front?(c) }.
// A beat is { say: [who, text, sfx?], do(c), wait: seconds, until(c) }.
// Beats run in order; a beat ends once its line is spoken, `wait` has passed and `until` is true.
// Actors are keyed by lowercase speaker name ("mousie", "birdie", "trex", "firetruck"…)
// so speech bubbles find who is talking.
const SCENES = {};
let cut = null;

function actor(draw, x, y, s = 1, more = {}) {
  return Object.assign({ draw, x, y, s, flip: false, o: {}, tx: null, speed: 160, vy: 0, jy: 0, alpha: 1, rot: 0, visible: true, z: 0, head: 120, fly: false, walk: false, walkScroll: false }, more);
}
function moveTo(a, x, speed = 160) { a.tx = x; a.speed = speed; }
function hop(a, v = 520) { if (a.jy === 0) a.vy = -v; }
const arrived = (...as) => as.every((a) => a.tx === null);
const whoKey = (who) => who.toLowerCase().replace(/[^a-z]/g, "");

function playScene(id) {
  showOnly(null);
  parts = []; texts = []; shake = 0;
  cut = { id, def: SCENES[id], t: 0, scroll: 0, scrollSpeed: 0, actors: {}, beat: -1, beatT: 0, talking: false, bubble: null, fade: 1, fadeTo: 0, ending: false, skipAt: 0 };
  cut.def.setup(cut);
  setCaption("", "");
  setControls([{ icon: "⏩", label: "Skip", color: "gray", keys: [" ", "Enter", "ArrowRight"], keyName: "space", fn: skipBeat }]);
  nextBeat();
}
function nextBeat() {
  const c = cut;
  c.beat++; c.beatT = 0; c.bubble = null; c.talking = false;
  if (c.def.beats[c.beat]?.say) { const [w, t] = c.def.beats[c.beat].say; setCaption(w, t); }
  const b = c.def.beats[c.beat];
  if (!b) { c.ending = true; c.fadeTo = 1; return; }
  if (b.do) b.do(c);
  if (b.say) {
    const [who, text, fx] = b.say;
    c.bubble = { who, text };
    c.talking = true;
    talk(who, text, fx, () => { if (cut === c && c.def.beats[c.beat] === b) c.talking = false; });
  }
}
function skipBeat() {
  const c = cut;
  if (!c || c.ending || c.t - c.skipAt < 0.35) return;
  c.skipAt = c.t;
  stopSpeech();
  for (const a of Object.values(c.actors)) if (a.tx !== null) { a.x = a.tx; a.tx = null; }
  nextBeat();
}
// Speak one line; calls done when the voice finishes (or after a reading-time guess).
function talk(who, text, fx, done) {
  if (fx && sfx[fx]) sfx[fx]();
  const guess = 900 + text.length * 65;
  let over = false;
  const fin = () => { if (!over) { over = true; clearTimeout(guard); done(); } };
  const voiceOn = settings.read && "speechSynthesis" in window;
  const guard = setTimeout(fin, voiceOn ? guess * 2.5 + 2500 : guess);
  if (!voiceOn) return;
  stopSpeech();
  const u = new SpeechSynthesisUtterance(text.replace(/!!+/g, "!").replace(/\?\?+/g, "?"));
  const v = VOICE[who] || VOICE.Narrator;
  u.pitch = v.pitch; u.rate = v.rate; if (voice) u.voice = voice;
  u.onend = fin; u.onerror = fin;
  speechSynthesis.speak(u);
}
function updateCut(dt) {
  const c = cut;
  c.t += dt; c.beatT += dt;
  c.scroll += c.scrollSpeed * dt;
  for (const a of Object.values(c.actors)) {
    if (a.tx !== null) {
      const d = a.tx - a.x, st = a.speed * dt;
      if (Math.abs(d) <= st) { a.x = a.tx; a.tx = null; } else { a.x += Math.sign(d) * st; a.flip = d < 0; }
    }
    a.vy += 2000 * dt; a.jy += a.vy * dt;
    if (a.jy > 0) { a.jy = 0; a.vy = 0; }
  }
  if (c.def.update) c.def.update(c, dt);
  c.fade += (c.fadeTo - c.fade) * Math.min(1, dt * 5);
  const b = c.def.beats[c.beat];
  if (!c.ending && b && !c.talking && c.beatT >= (b.wait ?? (b.say ? 0.35 : 1)) && (!b.until || b.until(c))) nextBeat();
  if (c.ending && c.fade > 0.96) { cut = null; next(); }
}
function drawCut() {
  const c = cut;
  c.def.bg(c);
  const list = Object.values(c.actors).filter((a) => a.visible).sort((a, b) => a.z - b.z);
  for (const a of list) {
    ctx.save();
    ctx.globalAlpha = a.alpha;
    const walking = a.tx !== null || a.walk || (a.walkScroll && c.scrollSpeed > 0);
    const bob = a.fly ? Math.sin(c.t * 3 + a.x * 0.01) * 10 : 0;
    a.draw(a.x, a.y + a.jy + bob, a.s, { t: c.t + a.x * 0.001, walk: walking, flip: a.flip, rot: a.rot, ...a.o });
    ctx.restore();
  }
  if (c.def.front) c.def.front(c);
  drawFx();
  if (c.bubble) (uprightPhone.matches ? drawTalkMarker(c) : drawBubble(c));
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 24); ctx.fillRect(0, H - 24, W, 24);
  if (c.fade > 0.01) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, c.fade)})`; ctx.fillRect(0, 0, W, H); }
}
// Upright phones put the words in the caption below; on the picture a bouncing arrow shows who's talking.
function drawTalkMarker(c) {
  const a = c.actors[whoKey(c.bubble.who)];
  if (!a || !a.visible) return;
  const x = Math.max(160, Math.min(W - 160, a.x)), y = Math.max(70, a.y + a.jy - a.head * a.s - 30 - Math.abs(Math.sin(c.t * 6)) * 14);
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.fillStyle = "#ffd75e";
  ctx.beginPath(); ctx.moveTo(x - 30, y - 40); ctx.lineTo(x + 30, y - 40); ctx.lineTo(x, y); ctx.closePath(); ctx.fill(); ctx.stroke();
}
const BUBBLE_FONT = 'bold 26px "Chalkboard SE", "Comic Sans MS", cursive';
function wrapText(text, maxW) {
  ctx.font = BUBBLE_FONT;
  const out = []; let line = "";

    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
  }

}
function drawBubble(c) {
  const { who, text } = c.bubble;
  const a = c.actors[whoKey(who)];
  const lines = wrapText(text, 360);
  ctx.font = BUBBLE_FONT;
  const bw = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 40, bh = lines.length * 32 + 26;
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (!a || !a.visible) { // narrator caption box
    const bx = (W - bw) / 2, by = 40;
    ctx.fillStyle = "#fff6c9"; ctx.fillRect(bx, by, bw, bh); ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = INK; lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 29 + i * 32));
    ctx.textBaseline = "alphabetic";
    return;
  }
  const hx = a.x, hy = a.y + a.jy - a.head * a.s - 14;
  const bx = Math.max(16, Math.min(W - bw - 16, hx - bw / 2)), by = Math.max(34, Math.min(H - bh - 60, hy - bh - 26));
  const tipX = Math.max(bx + 24, Math.min(bx + bw - 24, hx)), tipY = Math.max(by + bh + 8, hy);
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 22); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tipX - 14, by + bh - 2); ctx.lineTo(tipX + (hx > tipX ? 10 : -4), tipY); ctx.lineTo(tipX + 14, by + bh - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillRect(tipX - 12, by + bh - 6, 24, 6);
  ctx.fillStyle = INK; lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + 29 + i * 32));
  ctx.textBaseline = "alphabetic";
}

// Scene: Mousie and Birdie find a cave, tiptoe inside and meet a Velociraptor.
const CAVE_MOUTH_START = 1250; // where the cave mouth starts (screen x at scroll 0)
const CAVE_MOUTH_STOP = 640; // screen x where the camera stops in front of it

function caveMouthX(c) { return CAVE_MOUTH_START - c.scroll; }

SCENES.cave = {
  setup(c) {
    c.actors.mousie = actor(drawMouse, 280, GROUND, 1, { head: 115, walkScroll: true, z: 1 });
    c.actors.birdie = actor(drawBird, 390, GROUND - 250, 1, { head: 30, fly: true, z: 2 });
    c.inside = false;
    c.entering = false;
    c.tremble = false;
  },
  bg(c) {
    if (c.inside) { drawCave(c.scroll, false); return; }
    drawForest(c.scroll);
    const mx = caveMouthX(c);
    if (mx < W + 200) drawCaveMouth(mx);
  },
  update(c, dt) {
    const m = c.actors.mousie, b = c.actors.birdie;
    // camera stops when the cave mouth is in front of them
    if (!c.inside && !c.entering && c.scrollSpeed > 0 && caveMouthX(c) <= CAVE_MOUTH_STOP) {
      c.scroll = CAVE_MOUTH_START - CAVE_MOUTH_STOP;
      c.scrollSpeed = 0;
    }
    // walking into the dark mouth: get smaller and fade into the shadow
    if (c.entering) {
      for (const a of [m, b]) {
        const k = Math.max(0, Math.min(1, (CAVE_MOUTH_STOP + 30 - a.x) / 220)); // 1 = outside, 0 = deep in the dark
        a.s = 0.5 + 0.5 * k;
        a.alpha = k;
      }
      m.y = GROUND - (1 - m.s) * 60; // a little further away = a little higher
      b.y = Math.min(GROUND - 110, b.y + dt * 110);
    }
    if (c.eyes > 0) c.eyes = Math.min(1, c.eyes + dt * 1.5);
    // nervous tiptoe: little bouncy steps
    if (c.inside && c.scrollSpeed > 0) m.y = GROUND - Math.abs(Math.sin(c.t * 7)) * 7;
    else if (c.inside) m.y = GROUND;
    // trembling with fright
    if (c.tremble) m.x = c.mx0 + Math.sin(c.t * 70) * 3.5;
  },
  front(c) {
    if (!c.inside) drawJungleFront(c.scroll);
    // the raptor's glowing eyes in the dark before it steps out
    if (c.eyes > 0) {
      ctx.globalAlpha = Math.min(1, c.eyes);
      const blink = Math.sin(c.t * 3) > 0.92 ? 0.2 : 1;
      ell(880, 300, 9, 7 * blink, "#ffd75e", 0, false);
      ell(910, 296, 9, 7 * blink, "#ffd75e", 0, false);
      ctx.globalAlpha = 1;
    }
  },
  beats: [
    // walking through the jungle until the cave scrolls into view
    { do(c) { c.scrollSpeed = 220; }, wait: 1, until: (c) => c.scrollSpeed === 0 },
    { say: ["Mousie", "Look! A cave!"], do(c) { hop(c.actors.mousie, 420); sfx.squeak(); addText("!", c.actors.mousie.x + 30, GROUND - 150, "#ffd75e", 60, 1); } },
    { say: ["Birdie", "Let's go inside!", "chirp"], do(c) { hop(c.actors.birdie, 300); } },

}

function treehouseSideBubble(text, ax, ay, side) {

  const bx = side === "left" ? Math.max(16, ax - 36 - bw) : Math.min(W - bw - 16, ax + 36);
  const by = Math.max(34, Math.min(H - bh - 60, ay - bh / 2 - 20));

  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.fillStyle = "#fff";

  ctx.beginPath(); ctx.moveTo(edge, my - 13); ctx.lineTo(ax, ay); ctx.lineTo(edge, my + 13); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillRect(side === "left" ? edge - 6 : edge, my - 11, 6, 22);

}

    c.actors.mousie = actor(drawMouse, 555, 310, 1, { head: 115, z: 3 });
    c.actors.birdie = actor(drawBird, 340, 640, 1, { head: 30, fly: true, z: 4 });
    c.actors.daddy = actor(drawMouse, 622, 160, 0.2, { head: 115, z: 2, flip: true, visible: false, o: { color: "#8a6440" } });
  },
  bg() { drawTreeHouse(10); },
  front(c) {
    // take over the bubble for the speakers standing on the platform (and the narrator);
    // front() runs just before the engine draws bubbles, so it never flashes in the wrong place
    if (c.bubble && c.bubble.who !== "Birdie") { c.own = { ...c.bubble, beat: c.beat }; c.bubble = null; }
    const d = c.actors.daddy;
    if (d.visible && c.wave) treehouseDrawWave(d, c.t);
    // lines spoken up on the platform
    const b = c.own;
    if (!b || b.beat !== c.beat || uprightPhone.matches) return; // upright phones show the words in the caption
    if (b.who === "Mousie") { const m = c.actors.mousie; treehouseSideBubble(b.text, m.x - 22, m.y + m.jy - 80, "left"); }
    else if (b.who === "Daddy") treehouseSideBubble(b.text, d.x + 30 * d.s, d.y + d.jy - 82 * d.s, "right");

  },
  update(c, dt) {
    const m = c.actors.mousie, b = c.actors.birdie, d = c.actors.daddy;
    // climbing the last rungs, one rung at a time
    if (c.climbing && m.y > 160) {

      if (c.climbT <= 0) { c.climbT = 0.42; m.ty = Math.max(160, m.y - 30); sfx.climb(7 + c.climbStep++); }
      m.y += (m.ty - m.y) * Math.min(1, dt * 14);

    }
    if (c.birdieTY !== undefined) b.y += (c.birdieTY - b.y) * Math.min(1, dt * 2.5);
    // Daddy pops out of the door with a springy grow
    if (d.visible && d.s < 1.1) d.s = Math.min(1.1, d.s + dt * 4);
    if (c.party > 0) {
      c.party -= dt;
      if (Math.random() < dt * 12) burst(60 + Math.random() * 840, 50 + Math.random() * 60, 6, TREEHOUSE_CONFETTI, 150, 5, 1.6);
    }
  },
  beats: [
    { wait: 0.7 },
    { do(c) { c.climbing = true; c.climbT = 0; }, until: (c) => c.actors.mousie.y <= 160 },
    { do(c) { c.climbing = false; moveTo(c.actors.mousie, 500, 110); }, until: (c) => arrived(c.actors.mousie) },
    { do(c) {
      const m = c.actors.mousie;
      m.flip = false; hop(m, 520); sfx.squeak();
      addText("Yay!", m.x - 120, 115, "#ffd75e", 48, 1.1);
      burst(m.x, m.y - 60, 16, ["#fff6c9", "#ffd75e"], 240, 5, 0.9);
    }, wait: 1 },
    { do(c) { c.birdieTY = 240; moveTo(c.actors.birdie, 360, 60); sfx.chirp(); }, until: (c) => c.actors.birdie.y < 260 },
    { say: ["Mousie", "It's perfect! Safe and wonderful."], do(c) { hop(c.actors.mousie, 300); } },
    { say: ["Birdie", "Hooray! We made it!", "fanfare"], do(c) {
      hop(c.actors.birdie, 300); hop(c.actors.mousie, 500);
      [240, 520, 780].forEach((x) => burst(x, 120, 28, TREEHOUSE_CONFETTI, 380, 6, 1.4));
      c.party = 1.4;
    } },
    { wait: 0.5 },
    { do(c) {
      const d = c.actors.daddy;
      d.visible = true; hop(d, 380); c.wave = true; sfx.squeak();
      addText("!", d.x, 40, "#e0574f", 56, 0.9);
      hop(c.actors.mousie, 420);
    }, wait: 1 },
    { say: ["Daddy", "Welcome home, my brave little Mousie!"], do(c) { hop(c.actors.daddy, 220); } },
    { do(c) {
      hop(c.actors.mousie, 460); c.wave = false;
      addText("♥", 562, 80, "#e0574f", 60, 1.6);
      sfx.squeak();
    }, wait: 1.3 },
    { say: ["Narrator", "The End... for now!", "fanfare"], do(c) { c.party = 3.5; c.wave = true; hop(c.actors.mousie, 400); hop(c.actors.birdie, 260); } },
    { wait: 2.2 },
  ],
};

/* ---------------- effects ---------------- */

}

function updFx(dt) {
  parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; });
  parts = parts.filter((p) => p.life > 0);
  texts.forEach((t) => { t.y -= 30 * dt; t.life -= dt; });

function drawCaveMouth(x) {
  ctx.fillStyle = "#8a7a6a"; ctx.beginPath(); ctx.ellipse(x, GROUND, 170, 230, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = "#1e1814"; ctx.beginPath(); ctx.ellipse(x, GROUND, 95, 160, 0, Math.PI, 0); ctx.fill();
  ctx.font = 'bold 26px "Chalkboard SE", "Comic Sans MS", cursive'; ctx.fillStyle = "#3b2a1e"; ctx.textAlign = "center"; ctx.fillText("CAVE", x, GROUND - 180);
}
function drawProgress(p, fromIcon, toIcon) {
  const x0 = 260, x1 = 700, y = 34;
  ctx.fillStyle = "rgba(251,244,226,.9)"; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x0 - 10, y - 14, x1 - x0 + 20, 28, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#5f9e45"; ctx.beginPath(); ctx.roundRect(x0 - 6, y - 10, (x1 - x0 + 12) * Math.min(1, p), 20, 10); ctx.fill();
  ctx.font = "34px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(toIcon, x1 + 36, y + 2);
  ctx.fillText(fromIcon, x0 + (x1 - x0) * Math.min(1, p), y + 2);
  ctx.textBaseline = "alphabetic";
}
function drawHearts(x, y, hp, max, label) {
  ctx.font = 'bold 22px "Chalkboard SE", "Comic Sans MS", cursive'; ctx.textAlign = "center";
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.strokeText(label, x, y - 26); ctx.fillStyle = "#fff"; ctx.fillText(label, x, y - 26);
  const w = 220;
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(x - w / 2, y - 14, w, 22, 11); ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "#d8453b"; ctx.beginPath(); ctx.roundRect(x - w / 2 + 3, y - 11, (w - 6) * Math.max(0, hp / max), 16, 8); ctx.fill();
}
function drawCheeseCount() {
  ctx.font = 'bold 28px "Chalkboard SE", "Comic Sans MS", cursive'; ctx.textAlign = "left";
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.strokeText(`🧀 ${game.cheese}`, 134, 92); ctx.fillStyle = "#ffd75e"; ctx.fillText(`🧀 ${game.cheese}`, 134, 92);
}
function drawCheese(x, y, s = 1) {
  begin(x, y, s, false);
  poly([-20, 10, 20, 10, 20, -4, -20, -14], "#ffd75e");
  ell(-6, 0, 4, 3, "#e9b63a", 0, false); ell(8, 4, 3, 2, "#e9b63a", 0, false);
  ctx.restore();
}
function drawObstacle(o) {
  if (o.type === "log") {
    ctx.save(); ctx.translate(o.x + o.w / 2, GROUND - o.h / 2 + o.dy); ctx.rotate(o.rot);
    ctx.fillStyle = "#8a5a2b"; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(-o.w / 2, -o.h / 2, o.w, o.h, 14); ctx.fill(); ctx.stroke();
    ell(o.w / 2 - 6, 0, 10, o.h / 2 - 2, "#d6a96e");
    ctx.restore();
  } else {
    ctx.save(); ctx.translate(o.x + o.w / 2, GROUND + o.dy); ctx.rotate(o.rot);
    ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 0, o.w / 2, o.h, 0, Math.PI, 0); ctx.closePath();
    ctx.fillStyle = "#9b9488"; ctx.fill(); ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
  }
}

/* ---------------- levels ---------------- */
const LEVELS = {
  run: {

    },
    controls: (s) => [{ icon: "⬆️", label: "JUMP", color: "orange", keys: [" ", "ArrowUp", "j"], keyName: "space", fn: () => {

    } }],
    update(s, dt) {
      const sp = s.won ? 0 : s.stun > 0 ? 120 : s.speed;
      s.dist += sp * dt; s.stun -= dt;
      s.vy += 2000 * dt; s.my += s.vy * dt;
      if (s.my > 0) { s.my = 0; s.vy = 0; s.jumps = 0; }
      const left = s.goal - s.dist;
      if (left > 1300) {
        if ((s.nextObs -= dt) <= 0) {
          const log = Math.random() < 0.55;
          s.obs.push({ type: log ? "log" : "rock", x: W + 40, w: log ? 80 : 56, h: log ? 34 : 38, hit: false, dy: 0, rot: 0, vy: 0 });
          s.nextObs = 1.4 + Math.random() * 1.1;
        }
        if ((s.nextCheese -= dt) <= 0) {
          s.cheese.push({ x: W + 40, y: Math.random() < 0.5 ? GROUND - 40 : GROUND - 150, got: false });
          s.nextCheese = 0.9 + Math.random() * 0.8;
        }
      }
      s.obs.forEach((o) => {
        o.x -= sp * dt;
        if (o.hit) { o.vy += 1500 * dt; o.dy += o.vy * dt; o.rot += 6 * dt; o.x += 200 * dt; }
        const mx = 200, my = GROUND + s.my;
        if (!o.hit && mx + 18 > o.x && mx - 18 < o.x + o.w && my > GROUND - o.h + 6) {

        }
      });
      s.obs = s.obs.filter((o) => o.x > -150 && o.dy < 400);
      s.cheese.forEach((c) => {
        c.x -= sp * dt;
        if (!c.got && Math.hypot(c.x - 210, c.y - (GROUND + s.my - 55)) < 55) {
          c.got = true; game.cheese++; sfx.cheese(); burst(c.x, c.y, 10, ["#ffd75e", "#fff"], 200, 4, 0.5);
        }
      });
      s.cheese = s.cheese.filter((c) => !c.got && c.x > -50);

    },
    draw(s) {

  raptor: {

// The big tree with the treehouse and a ladder (ladder top is at y = 170, x ≈ 555).
function drawTreeHouse(rungs = 10, scroll = 300, forest = true) {
  if (forest) drawForest(scroll, 0.12);
  // tree trunk & branches
  ctx.fillStyle = "#7a5534"; ctx.strokeStyle = INK; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(620, H); ctx.lineTo(650, 120); ctx.lineTo(780, 120); ctx.lineTo(820, H); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#3f8a3a";
  [[600, 60], [720, 30], [860, 60], [500, 90], [930, 120]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 90, 0, 7); ctx.fill(); });
  // treehouse
  poly([440, 160, 830, 160, 830, 175, 440, 175], "#8a5a2b");
  poly([470, 160, 470, 70, 780, 70, 780, 160], "#c58a4f");
  poly([450, 75, 625, -10, 800, 75], "#a0522d");
  poly([520, 95, 560, 95, 560, 135, 520, 135], "#bfe3f5");
  poly([690, 95, 730, 95, 730, 135, 690, 135], "#bfe3f5");
  poly([600, 100, 645, 100, 645, 160, 600, 160], "#6b4423");
  ctx.font = 'bold 18px "Chalkboard SE", "Comic Sans MS", cursive'; ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.fillText("TREE HOUSE", 625, 90);
  // ladder
  ctx.strokeStyle = "#8a5a2b"; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(520, GROUND + 10); ctx.lineTo(530, 170); ctx.moveTo(590, GROUND + 10); ctx.lineTo(590, 170); ctx.stroke();
  ctx.lineWidth = 6;
  for (let i = 0; i <= rungs; i++) { const ry = GROUND - i * 30 + 5; ctx.beginPath(); ctx.moveTo(522, ry); ctx.lineTo(590, ry); ctx.stroke(); }
}

function startLevel(id) {
  showOnly(null);
  parts = []; texts = []; shake = 0;
  const L = LEVELS[id];
  const s = { id, t: 0, won: false };
  L.init(s);
  s.btns = setControls(L.controls(s));
  scene = s;
  help(L.help);
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (scene) {
    const L = LEVELS[scene.id];
    scene.t += dt;
    L.update(scene, dt); updFx(dt);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.clearRect(-50, -50, W + 100, H + 100);
    L.draw(scene); drawFx();
    ctx.restore();
  } else if (cut) {
    updateCut(dt); updFx(dt);
  }
  if (cut) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.clearRect(-50, -50, W + 100, H + 100);
    drawCut();
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
goTitle();
requestAnimationFrame(frame);
</script>
